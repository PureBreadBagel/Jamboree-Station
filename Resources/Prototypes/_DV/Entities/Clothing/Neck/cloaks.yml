- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakMystagogue
  name: research director's other cloak #credit to impstation for the original idea
  #suffix: Delta-V (credit to DV but we don't have a suffix like this)
  description: A comfy white and purple cloak, perfect for those sleepless nights when you're haunted by the yet unsolved mysteries of the universe.
  components:
  - type: Sprite
    sprite: _DV/Clothing/Neck/Cloaks/mystacloak.rsi
  - type: Clothing
    sprite: _DV/Clothing/Neck/Cloaks/mystacloak.rsi

