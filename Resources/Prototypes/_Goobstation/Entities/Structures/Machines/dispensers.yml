- type: entity
  id: EnergyChemDispenser
  parent: EnergyReagentDispenserBase
  name: Energy chemical dispenser
  suffix: energy
  description: A bluespace Chemical Dispenser that uses station energy to synthesize Reagents. The future is here and now.
  components:
  - type: Sprite
    sprite: Structures/dispensers.rsi
    state: industrial-working
    snapCardinals: false
  - type: Machine
    board: EnergyChemDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
  - type: EnergyReagentDispenser
    reagents:
      Aluminium: 8
      Blood: 6
      Carbon: 10
      Chlorine: 10
      Copper: 8
      Cryoxadone: 30
      Ethanol: 8
      Fluorine: 10
      Hydrogen: 10
      Iodine: 10
      Iron: 6
      Lithium: 5
      Nitrogen: 10
      Oxygen: 10
      Phosphorus: 8
      Potassium: 8
      Radium: 10
      Silicon: 8
      Sodium: 10
      Sugar: 5
      Sulfur: 11
      TableSalt: 20
  - type: Battery
    maxCharge: 3000
    startingCharge: 400
