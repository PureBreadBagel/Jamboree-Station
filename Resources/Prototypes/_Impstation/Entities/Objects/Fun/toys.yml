- type: entity
  parent: BasePlushie
  id: PlushieGriffy
  name: griffy plushie
  description: A plush version of Griffy, The Sec Safety Dog! Made of the recycled scraps from Griffy performers that have fallen in the line of duty.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_mascotgriffy

- type: entity
  parent: BasePlushie
  id: PlushieThaven
  name: thaven plushie
  description: It is rude to not give this plushie hugs and kisses.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_thaven

- type: entity
  parent: BasePlushie
  id: PlushieGoblin
  name: goblin plushie
  description: It's life-size!
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_goblin
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_NF/Voice/Goblin/goblin-scream-1.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_NF/Voice/Goblin/goblin-cry-2.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_NF/Voice/Goblin/goblin-cry-2.ogg
