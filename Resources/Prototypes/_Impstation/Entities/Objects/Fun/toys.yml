- type: entity
  parent: BasePlushie
  id: PlushieGriffy
  name: griffy plushie
  description: A plush version of Griffy, The Sec Safety Dog! Made of the recycled scraps from Griffy performers that have fallen in the line of duty.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_mascotgriffy

- type: entity
  parent: BasePlushie
  id: PlushieThaven
  name: thaven plushie
  description: It is rude to not give this plushie hugs and kisses.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_thaven

- type: entity
  parent: BasePlushie
  id: PlushieGoblin
  name: goblin plushie
  description: It's life-size!
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_goblin
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_NF/Voice/Goblin/goblin_scream_1.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_NF/Voice/Goblin/goblin_cry_2.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_NF/Voice/Goblin/goblin_cry_2.ogg

- type: entity
  parent: BasePlushie
  id: PlushieAnomalocarid
  name: anomalocarid plushie
  description: You bet you could throw this really really far if you held it by the legs and started spinning.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: plushie_anomalocarid
  - type: Item
    inhandVisuals:
      left:
        - state: plushie_anomalocarid-inhand-left
      right:
        - state: plushie_anomalocarid-inhand-right
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Impstation/Voice/Anomalocarid/anomalocarid_talk.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Impstation/Voice/Anomalocarid/anomalocarid_exclaim.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_Impstation/Voice/Anomalocarid/anomalocarid_scream.ogg
  - type: MultiHandedItem
