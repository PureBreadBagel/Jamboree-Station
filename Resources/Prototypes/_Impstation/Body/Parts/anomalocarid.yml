- type: entity
  id: PartAnomalocarid
  parent: [BaseItem, BasePart]
  name: "anomalocarid body part"
  abstract: true
  components:
  - type: Sprite # Shitmed Change
    sprite: _Impstation/Mobs/Species/Anomalocarid/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Anomalocarid
  - type: Damageable # Shitmed
    damageModifierSet: Anomalocarid
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#3d909c"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: CopperBlood
        Quantity: 10

