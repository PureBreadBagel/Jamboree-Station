- type: speechSounds
  id: Xeepish #ID changed to avoid possible conflict
  saySound:
    path: /Audio/_Impstation/Voice/Talk/gray.ogg
  askSound:
    path: /Audio/_Impstation/Voice/Talk/gray_ask.ogg
  exclaimSound:
    path: /Audio/_Impstation/Voice/Talk/gray_exclaim.ogg

- type: emoteSounds
  id: UnisexGray
  params:
    variation: 0.125
  sounds:
    Scream:
      path: /Audio/_Impstation/Voice/Gray/gray_scream.ogg
    Laugh:
      path: /Audio/_Impstation/Voice/Gray/gray_laugh.ogg
    Sneeze:
      collection: UnisexSneezes
    Cough:
      path: /Audio/_Impstation/Voice/Gray/gray_cough.ogg
    Hiss:
      collection: GoblinHiss #change
    MonkeyScreeches:
      collection: MonkeyScreeches
    Yawn:
      path: /Audio/_Impstation/Voice/Gray/gray_yawn.ogg
    Snore:
      collection: Snores
    Sigh:
      path: /Audio/_Impstation/Voice/Gray/gray_sigh.ogg
    Honk:
      collection: BikeHorn
    Crying:
      path: /Audio/_Impstation/Voice/Gray/gray_cry.ogg
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Hew:
      collection: Hew
    Gulp: # goob
      path: /Audio/_Goobstation/Voice/gulpexotic.ogg
    Surprised: # Goob
      path: /Audio/_Goobstation/Voice/surprised.ogg
    Gasp:
      path: /Audio/_Impstation/Voice/Gray/gray_gasp.ogg
    DefaultDeathgasp:
      path: /Audio/_Impstation/Voice/Gray/gray_deathgasp.ogg
