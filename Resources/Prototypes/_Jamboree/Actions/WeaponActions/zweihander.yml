- type: entity
  id: ActionZweihanderStab
  name: Sweep
  description: Perform a sweeping motion with the halberd, hitting an area infront of you.
  components:
  - type: InstantAction
    event: !type:EventZweihanderAction
  - type: Action
    useDelay: 1
    checkConsciousness: true
  - type: WeaponAction

- type: entity
  id: ZweihanderStab
  name: zweihander stab
  categories: [ HideSpawnMenu ]
  components:
  - type: MovementIgnoreGravity
  - type: Sprite
    sprite: _Jamboree/Effects/WeaponActions/wardenhalberdslash.rsi
    layers:
    - state: halberdslash
      scale: 1.2, 1.2
      shader: unshaded
    noRot: false
  - type: Physics
    bodyType: Dynamic
    linearDamping: 1
    angularDamping: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5, -1, 0.5, 1"
        density: 1
        hard: false
        mask:
        - BulletImpassable
        - Opaque
  - type: Projectile
    impactEffect: null
    deleteOnCollide: false
    penetrate: true
    damage:
      types:
        Blunt: 30
    soundHit: null
    forceSound: true
  - type: TimedDespawn
    lifetime: 0.52
  - type: Tag
    tags:
    - HideContextMenu
  - type: WeaponAction
  - type: WeaponActionEntity
    damage:
      types:
        Slash: 15
