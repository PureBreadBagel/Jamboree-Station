- type: entity
  id: GeneratorMicro
  description: This generator does not require fuel, and can be somewhat easily picked up. It provides 20 kW of power.
  name: micro-fission generator
  suffix: Item, 20.0kW
  placement:
    mode: SnapgridCenter
  components:
  - type: AmbientSound
    range: 5
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.5,0.4,0.3"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        hard: False
  - type: Transform
    anchored: false
    noRot: true
  - type: Sprite
    sprite: _Jamboree/Structures/Power/Generation/microgenerator.rsi
    noRot: true
    layers:
    - state: icon
      map: [ "enum.GeneratorVisualLayers.Body" ]
    - state: microgenon_unlit
      map: [ "enum.GeneratorVisualLayers.Unlit" ]
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.GeneratorVisuals.Running:
        enum.GeneratorVisualLayers.Body:
          True: { state: microgenon }
          False: { state: icon }
        enum.GeneratorVisualLayers.Unlit:
          True: { visible: true }
          False: { visible: false }
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: _Jamboree/Structures/Power/Generation/microgenerator.rsi
    state: generator
  - type: PowerSupplier
    supplyRate: 20000
    supplyRampRate: 500
    supplyRampTolerance: 500
    voltage: medium
  - type: Anchorable
  - type: Pullable
  - type: PacifismDangerousAttack
  - type: Item # this item's whole gimmick
    size: Huge
