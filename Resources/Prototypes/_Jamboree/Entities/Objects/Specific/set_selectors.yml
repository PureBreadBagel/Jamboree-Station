# Captain

- type: entity
  id: CaptainUndeterminedWeapon
  name: undetermined captain kit
  description: A small box utilizing bluespace technology to drop in a loadout directly to you. Choose wisely.
  parent: [ BaseItem, BaseSetSelector, BaseCommandContraband]
  components:
  - type: Sprite
    sprite: _Jamboree/Objects/Specific/Command/kitselectors.rsi
    state: CAP-selector
  - type: SetSelector
    possibleSets:
    - AntiqueLaserKit
    - CapDiplomatKit
    - CapPirateKit
    - CapLordKit
    - CapSupportKit
    maxSelectedSets: 1

