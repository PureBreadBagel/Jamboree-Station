- type: entity
  id: EnergyCMODispenser
  parent: [BaseItem, PowerCellSlotMediumItem]
  name: portable emergichemical dispenser
  description: A compact bluespace dispenser for those who specialise in medicine. Who says you need a big machine when you can carry it in your pocket? A note from CentComm reads "DO NOT PUT MICROREACTORS IN THIS. THEY WILL BREAK IT. SERIOUSLY. DONT."
  components:
  - type: Sprite
    sprite: _Jamboree/Objects/Devices/energycmodispenser.rsi
    layers:
    - state: icon
      scale: 0.85, 0.85
    - state: beaker
      map: ["enum.EnergyReagentDispenserVisualLayers.Beaker"]
      visible: false
      scale: 0.85, 0.85
  - type: Item
    size: Normal
    sprite: _Jamboree/Objects/Devices/energycmodispenser.rsi
  - type: Appearance
  - type: EnergyReagentDispenserVisuals
    baseState: icon
    noPowerState: no-power
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        blacklist:
          tags:
          - PowerCellMicroreactor
          - PowerCellAntique
  - type: GuideHelp
    guides:
    - Chemist
    - Medical
  - type: ActivatableUI
    key: enum.EnergyReagentDispenserUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.EnergyReagentDispenserUiKey.Key:
        type: EnergyReagentDispenserBoundUserInterface
  - type: EnergyReagentDispenser
    energyBeakerSlot:
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        components:
        - FitsInDispenser
    reagents:
      Carbon: 20
      Charcoal: 30
      Dexalin: 25
      Devirate: 20
      Dylovene: 30
      Ethanol: 20
      Hydrogen: 20
      Inaprovaline: 20
      Kelotane: 25
      Oxygen: 20
      Saline: 21
      Spaceacilin: 20
      Sugar: 11
      Tricordrazine: 30
  - type: StealTarget # Jamboree - cmd/steal gear tweaks
    stealGroup: CMO


- type: entity
  id: EnergyOfficialDispenser
  parent: [BaseItem, PowerCellSlotMediumItem]
  name: bureaucratic emergichemical dispenser+
  description: An exceptional bluespace chemical dispenser...You can feel the CMO seething in their office as you walk around with this in your pocket. "Though be sure not to let crew have this, no seriously dont."
  components:
  - type: Sprite
    sprite: _Jamboree/Objects/Devices/energyofficialdispenser.rsi
    layers:
    - state: icon
      scale: 0.85, 0.85
    - state: beaker
      map: ["enum.EnergyReagentDispenserVisualLayers.Beaker"]
      visible: false
      scale: 0.85, 0.85
  - type: Item
    size: Normal
    sprite: _Jamboree/Objects/Devices/energyofficialdispenser.rsi
  - type: Appearance
  - type: EnergyReagentDispenserVisuals
    baseState: icon
    noPowerState: no-power
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
        blacklist:
          tags:
          - PowerCellMicroreactor
  - type: GuideHelp
    guides:
    - Chemicals
  - type: AccessReader
    access: [["CentralCommand"]]
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUI
    key: enum.EnergyReagentDispenserUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.EnergyReagentDispenserUiKey.Key:
        type: EnergyReagentDispenserBoundUserInterface
  - type: EnergyReagentDispenser
    energyBeakerSlot:
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        components:
        - FitsInDispenser
    reagents:
      Amnestizine: 30
      ChloralHydrate: 30
      Devirate: 20
      DexalinPlus: 8
      Doxarubixadone: 20
      Fentanyl: 10
      Ichor: 60
      MindbreakerToxin: 20
      MuteToxin: 20
      Necrosol: 25
      Neurotoxin: 15
      Omnizine: 16
      Pax: 20
      Rororium: 30
      Saline: 20
      Spaceacilin: 20
      Tetrasolcincide: 20
