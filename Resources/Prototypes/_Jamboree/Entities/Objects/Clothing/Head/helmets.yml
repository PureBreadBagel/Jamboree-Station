- type: entity
  parent: [ BaseMagicalContraband, ClothingHeadHelmetBase, ClothingHeadHelmetBaseFoldable ]
  id: ClothingHeadHelmetSergeantSol
  name: sergeant sol's raid suit helmet
  description: An armored helmet worn by sergeant sol. Woah...
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/Head/Helmet/sergeantsol.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/Head/Helmet/sergeantsol.rsi
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
