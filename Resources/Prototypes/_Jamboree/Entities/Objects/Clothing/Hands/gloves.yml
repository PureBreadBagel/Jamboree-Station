- type: entity
  parent: [ClothingHandsBase, BaseCommandContraband]
  id: ClothingHandsGlovesCMODefib
  name: defibrillator gloves
  description: Incredibly advanced medical technology, a defibrillator literally at your fingertips.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/Hands/Gloves/defibgloves.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/Hands/Gloves/defibgloves.rsi
  - type: Fiber
    fiberMaterial: fibers-latex
  - type: FingerprintMask
  - type: Speech
    speechVerb: Robotic
  - type: LanguageSpeaker # Einstein Engines - Language
  - type: LanguageKnowledge # Einstein Engines - Language
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -80 # cmd gear tweaks 3
  - type: DoAfter
  - type: UseDelay
  - type: StealTarget # Jamboree - cmd/steal gear tweaks
    stealGroup: CMO
  - type: DefibGloves
    whitelist:
      requireAll: true
      components:
      - MobState
      - Respirator


- type: entity
  parent: [ClothingHandsBase, BaseCommandContraband]
  id: ClothingHandsGlovesSol
  name: sol gloves
  description: Replicas of Sergeant Sol's gloves. Wearing these will allow the Sol Shield to return to you when thrown.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/Hands/Gloves/solgloves.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/Hands/Gloves/solgloves.rsi
  - type: Fiber
    fiberMaterial: fibers-heroic
  - type: FingerprintMask
  - type: StealTarget # Jamboree - cmd/steal gear tweaks
    stealGroup: HOS
  - type: Tag
    tags:
    - SolGloves

