- type: entity
  name: quarter cannon
  parent: [BaseWeaponRifle, BaseCommandContraband]
  id: WeaponRifleQuarterCannon
  description: An old "Tommy Gun" modified to shoot... quarters?
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/SMGs/typewriter.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/smg.ogg
  - type: ChamberMagazineAmmoProvider
    boltClosed: false
    soundRack:
      path: /Audio/Effects/kaching.ogg
    soundBoltClosed:
      path: /Audio/Effects/kaching.ogg
    soundBoltOpened:
      path: /Audio/Effects/kaching.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineQuarter
        insertSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineQuarterCannon
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeQuarter
        priority: 1
        whitelist:
          tags:
          - CartridgeQuarterCannon
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/SMGs/typewriter.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
