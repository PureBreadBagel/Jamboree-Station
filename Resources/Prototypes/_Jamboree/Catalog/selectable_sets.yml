# Head of Security

- type: selectableSet
  id: EnergyRevolverKit
  name: Wrangler Kit
  description: |
    - EG-04 Equalizer
        Comes with lethal and disabler energy speedloaders that are
        self-recharging.

    - Sanctioned Holocigar
        It's syndicate functionality has been stripped, and only serves to
        make you look awesome. Music still included.
  sprite:
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/erevolver.rsi
    state: icon
  content:
  - ClothingBeltHolsterFilledBlueshield
  - HOSHoloCigar

- type: selectableSet
  id: HOSSniperKit
  name: Marksman Kit
  description: |
    - HB-92 "Kovalskyi" Marksman Laser
        A destructive laser sniper. An inbuilt accuracy module allows you to
        aim further without using a scope.

    - Railgun Capacitor x1
        Ammunition for the Kovalskyi. It must be recharged after 3 shots.
  sprite:
    sprite: _Jamboree/Objects/Weapons/Guns/Snipers/kovalskyi.rsi
    state: icon
  content:
  - WeaponSniperRailgun
  - MagazineRailgun

- type: selectableSet
  id: LawbringerKit
  name: Lawbringer Kit
  description: |
    - Lawbringer
        A self-recharging energy pistol with 7 different firemodes.
  sprite:
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/lawbringer.rsi
    state: icon
  content:
  - WeaponEnergyGunLawbringer

- type: selectableSet
  id: HOSSolKit
  name: Sentinel Kit
  description: |
     - Sol Shield
        Can be thrown normally for blunt damage, or optionally toggled
        on to do stun damage. It does not do damage when thrown by someone
        not wearing the gloves, making it basically useless for anyone who
        steals it.

     - Sol Gloves
        The shield will return to whoever is wearing these. They are not
        insulated.

     - Sergeant Sol Comic
        A very rare first edition comic book.
  sprite:
    sprite: _Jamboree/Objects/Weapons/Melee/Shields/solshield.rsi
    state: icon
  content:
  - SolShield
  - ClothingHandsGlovesSol
  - SpawnSolComicRandom

- type: selectableSet
  id: NonlethalLauncherKit
  name: Controller Kit
  description: |
    - GL-06 Riot Grenade Launcher
        Will only load one 40mm shell at a time, but is very effective. Aim carefully.

    - 40mm Baton Grenades x4
        Baton grenades will deal 80 stamina damage on initial impact,
        and 50 more over a short period after.

    - 40mm Flash Grenades x6
        Flash grenades have the same functionality as a flashbang,
        but much more potent.
  sprite:
    sprite: _Goobstation/Objects/Weapons/Guns/Launchers/riotlauncher.rsi
    state: base
  content:
  - WeaponLauncherNonLethal
  - GrenadeBaton
  - GrenadeBaton
  - GrenadeBaton
  - GrenadeBaton
  - GrenadeFlash
  - GrenadeFlash
  - GrenadeFlash
  - GrenadeFlash
  - GrenadeFlash
  - GrenadeFlash

# Warden

- type: selectableSet
  id: WardenClassicKit
  name: Classic Kit
  description: |
     - Energy Shotgun
        Can switch firemodes to lethal or disabler. Does not
        self-recharge.

     - Krav Maga Gloves
        Provides the wearer with Krav Maga, a powerful martial
        art.
  sprite:
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
    state: icon
  content:
  - WeaponEnergyShotgun
  - ClothingHandsGlovesKravMaga

- type: selectableSet
  id: MultiphaseKit
  name: Dispatcher Kit
  description: |
     - X-01 Multiphase
        Can change between ion, lethal, and disabler bolts. Does not
        self-recharge, but has a high capacity.

     - Camera Tablet
        View cameras from anywhere on the station! Definitely not a
        camera bug with extra plastic on it.
  sprite:
    sprite: _DV/Objects/Weapons/Guns/Battery/multiphase_energygun.rsi
    state: icon
  content:
  - WeaponEnergyGunMultiphase
  - CameraTablet

- type: selectableSet
  id: WardenGuardKit
  name: Guardsman Kit
  description: |
    - Warden's Halberd
       It's a solid melee weapon, but also comes with the ability to
       swing in a wide area infront of you, knocking down anyone
       within range.

    - Warden's Plate Armor
       Repurposed plate armor that used to sit on display. It's not
       space-proofed.

    - Warden's Plate Helmet
       Good luck seeing through this. It's not space proof.
  sprite:
    sprite: _Jamboree/Objects/Weapons/Melee/wardenhalberd.rsi
    state: icon
