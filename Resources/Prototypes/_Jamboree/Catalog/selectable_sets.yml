  - WardenHalberd
  - ClothingHeadHatWardenArmor
  - ClothingOuterArmorWardenGuard

- type: selectableSet
  id: WardenArmorKit
  name: Firepower Kit
  description: |
    - Firepower Mk.6 Armor
       Once toggled, the gauntlets can toggle from lethal and disabler modes.
       The helmet has a MIDI player. The suit is also capable of flight.

    - Screwdriver
       Use this to remove the power cell in the suit.
  sprite:
    sprite: _Jamboree/Clothing/OuterClothing/Modsuits/firepower.rsi
    state: control
  content:
  - ClothingModsuitFirepower
  - Screwdriver

