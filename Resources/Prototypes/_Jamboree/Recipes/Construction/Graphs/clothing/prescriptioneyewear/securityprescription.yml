- type: constructionGraph
  id: GlassesPrescriptionSec
  start: start
  graph:
  - node: start
    edges:
    - to: glassesSecurityPrescription
      steps:
      - tag: GlassesSecurity
        name: construction-graph-tag-security-glasses
        icon:
          sprite: Clothing/Eyes/Glasses/secglasses.rsi
          state: icon
        doAfter: 5
      - tag: GlassesPrescription
        name: construction-graph-tag-prescription-glasses
        icon:
          sprite: Clothing/Eyes/Glasses/glasses.rsi
          state: icon
        doAfter: 5
      - material: Cable
        amount: 5
        doAfter: 5
  - node: glassesSecurityPrescription
    entity: ClothingEyesPrescriptionGlassesSec

