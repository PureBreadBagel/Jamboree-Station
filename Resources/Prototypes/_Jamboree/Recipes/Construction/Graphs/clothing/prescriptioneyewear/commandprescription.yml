- type: constructionGraph
  id: GlassesPrescriptionCommand
  start: start
  graph:
  - node: start
    edges:
    - to: glassesCommandPrescription
      steps:
      - tag: GlassesCommand
        name: construction-graph-tag-command-glasses
        icon:
          sprite: Clothing/Eyes/Glasses/commandglasses.rsi
          state: icon
        doAfter: 5
      - tag: GlassesPrescription
        name: construction-graph-tag-prescription-glasses
        icon:
          sprite: Clothing/Eyes/Glasses/glasses.rsi
          state: icon
        doAfter: 5
      - material: Cable
        amount: 5
        doAfter: 5
  - node: glassesCommandPrescription
    entity: ClothingEyesPrescriptionGlassesCommand

