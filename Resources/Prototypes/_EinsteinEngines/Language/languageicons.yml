# Base abstract icon for languages
- type: jobIcon
  id: LanguageIcon
  abstract: true
  priority: 1
  locationPreference: Right
  isShaded: true

# Fallback icon for languages without a specific icon
- type: jobIcon
  parent: LanguageIcon
  id: LanguageIconUnknown
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: Unknown
  jobName: language-icon-unknown

