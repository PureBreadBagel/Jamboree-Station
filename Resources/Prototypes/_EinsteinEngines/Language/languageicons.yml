# Base abstract icon for languages
- type: jobIcon
  id: LanguageIcon
  abstract: true
  priority: 1
  locationPreference: Right
  isShaded: true
  allowSelection: false

# Fallback icon for languages without a specific icon
- type: jobIcon
  parent: LanguageIcon
  id: LanguageIconUnknown
  icon:
    sprite: /Textures/_EinsteinEngines/Interface/language_icon.rsi
    state: unknown
  jobName: language-icon-unknown

