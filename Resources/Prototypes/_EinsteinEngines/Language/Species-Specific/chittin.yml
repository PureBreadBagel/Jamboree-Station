# Spoken by Chitinids.
- type: language
  id: Chittin
  isVisibleLanguage: true
  speech:
    color: "#7d7d7d"
    fontId: OnlyYou # TODO: If we use fonts, this needs to be changed because this underscore breaks parser and throws error.
  obfuscation:
    !type:SyllableObfuscation
    minSyllables: 1 # Replacements are really short
    maxSyllables: 2
    replacement:
    - click
    - clack
    - buzz
    - bizz
